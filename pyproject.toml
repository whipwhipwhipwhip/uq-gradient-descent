[project]
name = "uqsc"
version = "0.1.0"
description = "Uncertainty quantification for gradient and accelerated gradient descent on strongly convex functions (McMeel & Parpas)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
uqsc-experiments = "uqsc.experiments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uqsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
